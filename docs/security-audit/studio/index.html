<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-ditoria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eef1f2;
    --surface:#ffffff;
    --surface-alt:#e4e9eb;
    --text:#12191c;
    --text-muted:#4c5c62;
    --border:#cfd8db;
    --accent:#0e5c58;
    --accent-strong:#0a423f;
    --accent-soft:#dcece9;
    --shadow:0 1px 2px rgba(15,30,30,.06),0 6px 20px -8px rgba(15,30,30,.12);
    --strength:#059669;
    --sev-critica:#B91C1C;
    --sev-alta:#EA580C;
    --sev-media:#D97706;
    --sev-baixa:#2563EB;
    --sev-informativa:#6B7280;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b1315;
      --surface:#121c1f;
      --surface-alt:#1a2629;
      --text:#e7edee;
      --text-muted:#93a6ab;
      --border:#28383c;
      --accent:#3fb3a8;
      --accent-strong:#7fd6cb;
      --accent-soft:#12302d;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px -10px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b1315;
    --surface:#121c1f;
    --surface-alt:#1a2629;
    --text:#e7edee;
    --text-muted:#93a6ab;
    --border:#28383c;
    --accent:#3fb3a8;
    --accent-strong:#7fd6cb;
    --accent-soft:#12302d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 24px -10px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    font-size:16px;
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Fraunces',Georgia,serif;
    text-wrap:balance;
    margin:0;
    color:var(--text);
  }
  code,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  a{color:var(--accent-strong);}

  .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:20px 16px;
    display:flex;flex-direction:column;gap:18px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    min-width:34px;height:34px;padding:0 6px;border-radius:8px;
    background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:16px;letter-spacing:-.02em;flex:none;
  }
  .brand-title{font-family:'Fraunces',serif;font-weight:600;font-size:16px;line-height:1.2;}
  .brand-sub{font-size:12.5px;color:var(--text-muted);}
  .sidebar-label{
    font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--text-muted);margin-top:4px;
  }
  .project-list{display:flex;flex-direction:column;gap:2px;}
  .project-item{display:flex;flex-direction:column;}
  .project-row{display:flex;align-items:center;gap:2px;}
  .project-btn{
    display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;
    background:none;border:none;padding:8px 8px;border-radius:6px;
    color:var(--text);font:inherit;font-weight:500;cursor:pointer;
  }
  .project-btn:hover{background:var(--surface-alt);}
  .project-btn .caret{color:var(--text-muted);font-size:11px;transition:transform .15s;}
  .project-btn[data-open="true"] .caret{transform:rotate(90deg);}
  .project-btn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-delete-btn{
    flex:none;display:flex;align-items:center;justify-content:center;
    background:none;border:none;color:var(--text-muted);cursor:pointer;
    padding:6px;border-radius:6px;opacity:.5;transition:opacity .15s,color .15s,background .15s;
  }
  .project-delete-btn:hover,.project-delete-btn:focus-visible{opacity:1;background:var(--surface-alt);color:#B91C1C;}
  .project-delete-btn svg{display:block;}
  .run-list{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 26px;border-left:1px solid var(--border);}
  .run-btn{
    display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    background:none;border:none;padding:6px 10px;margin-left:-1px;border-left:2px solid transparent;
    color:var(--text-muted);font:inherit;font-size:14px;cursor:pointer;text-align:left;width:calc(100% + 1px);
  }
  .run-btn:hover{background:var(--surface-alt);}
  .run-btn[data-active="true"]{border-left-color:var(--accent);color:var(--text);font-weight:600;background:var(--accent-soft);}
  .run-btn .run-date{font-family:'IBM Plex Mono',monospace;}
  .run-btn .run-meta{font-size:12px;}
  .sidebar-empty,.sidebar-note{font-size:14px;color:var(--text-muted);padding:6px 8px;}

  /* ---------- main / toolbar ---------- */
  .main{min-width:0;}
  .toolbar{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 32px;background:var(--bg);border-bottom:1px solid var(--border);
    backdrop-filter:blur(6px);
  }
  .toolbar-info{font-size:14px;color:var(--text-muted);min-width:0;overflow-wrap:anywhere;}
  .toolbar-info strong{color:var(--text);font-weight:600;}
  .btn{
    font:inherit;font-weight:600;font-size:14px;border-radius:7px;padding:8px 14px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-strong);}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;}
  .btn-copy{font-size:13px;padding:5px 10px;}

  .report-root{padding:0 32px 64px;max-width:1200px;margin:0 auto;overflow-wrap:anywhere;}
  .cover-grid>*,.cov-grid>*,.sw-grid>*,.exec-grid>*,.stack-row>*{min-width:0;}
  .empty-state{padding:80px 20px;text-align:center;color:var(--text-muted);}
  .empty-state h2{font-size:21px;margin-bottom:8px;color:var(--text);}

  .report-page{padding:36px 0;border-bottom:1px solid var(--border);}
  .report-page:last-child{border-bottom:none;}
  .section-eyebrow{
    font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--accent);margin-bottom:6px;
  }
  .section-title{font-size:23px;font-weight:600;margin-bottom:18px;}

  /* ---------- cover ---------- */
  .cover{display:flex;flex-direction:column;gap:22px;padding-top:56px;}
  .cover-kicker{
    font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  }
  .cover-title{font-size:43px;font-weight:600;line-height:1.08;}
  .cover-date{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--text-muted);}
  .cover-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:8px;}
  .cover-card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:18px 20px;box-shadow:var(--shadow);
  }
  .cover-card h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-muted);font-family:'IBM Plex Sans',sans-serif;margin-bottom:8px;}
  .cover-card p{margin:0;color:var(--text);font-size:15px;}
  .stack-card{grid-column:1/-1;}
  .stack-table{display:flex;flex-direction:column;gap:0;}
  .stack-row{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:7px 0;border-top:1px solid var(--border);}
  .stack-row:first-child{border-top:none;padding-top:0;}
  .stack-layer{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .stack-detail{font-size:14.5px;color:var(--text);}

  /* ---------- executive summary ---------- */
  .exec-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:32px;align-items:start;}
  .donut-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;}
  .donut-figure{position:relative;width:200px;height:200px;}
  .donut-center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .donut-center .count{font-family:'Fraunces',serif;font-size:37px;font-weight:600;line-height:1;}
  .donut-center .label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
  .legend{display:flex;flex-direction:column;gap:8px;width:100%;max-width:230px;}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:14px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex:none;}
  .legend-name{flex:1;color:var(--text);}
  .legend-count{font-family:'IBM Plex Mono',monospace;color:var(--text-muted);font-size:13.5px;}

  .bar-chart{display:flex;align-items:flex-end;gap:10px;padding-top:16px;border-bottom:1px solid var(--border);}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;}
  .bar-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
  .bar-track{height:140px;width:100%;display:flex;align-items:flex-end;justify-content:center;}
  .bar{width:100%;max-width:26px;border-radius:4px 4px 0 0;background:var(--accent);min-height:3px;}
  .bar-id{margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-muted);}
  .category-legend{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13.5px;}
  .category-legend div{display:flex;justify-content:space-between;gap:8px;color:var(--text-muted);}
  .category-legend b{color:var(--text);font-weight:500;font-family:'IBM Plex Mono',monospace;margin-right:6px;}

  /* ---------- category coverage ---------- */
  .cov-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .cov-card{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;
  }
  .cov-card.is-na{background:var(--surface-alt);box-shadow:none;opacity:.72;}
  .cov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cov-name{font-size:14.5px;font-weight:600;}
  .cov-id{font-family:'IBM Plex Mono',monospace;color:var(--text-muted);margin-right:6px;font-weight:500;}
  .cov-maturity{
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;flex:none;
    padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-strong);
  }
  .cov-card.is-na .cov-maturity{background:var(--border);color:var(--text-muted);}
  .cov-body{font-size:13.5px;color:var(--text-muted);}
  .cov-body.cov-na-reason{font-style:italic;}
  .cov-body b{color:var(--text);font-weight:600;font-family:'IBM Plex Mono',monospace;}

  /* ---------- strengths / weaknesses ---------- */
  .sw-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .sw-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;box-shadow:var(--shadow);}
  .sw-card h3{font-size:15px;font-weight:600;margin-bottom:12px;font-family:'IBM Plex Sans',sans-serif;}
  .strength-item{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border);}
  .strength-item:first-child{border-top:none;padding-top:0;}
  .strength-dot{width:8px;height:8px;border-radius:50%;background:var(--strength);margin-top:6px;flex:none;}
  .strength-text .evidence{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-muted);display:block;margin-bottom:2px;}
  .strength-text .note{font-size:14.5px;}
  .weak-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .weak-list li{font-size:14.5px;padding-left:14px;position:relative;}
  .weak-list li::before{content:"\2013";position:absolute;left:0;color:var(--text-muted);}

  /* ---------- filters / table ---------- */
  .filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  select{
    font:inherit;font-size:14px;padding:7px 10px;border-radius:7px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);
  }
  table{width:100%;border-collapse:collapse;font-size:14.5px;}
  th{
    text-align:left;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-muted);padding:8px 10px;border-bottom:1px solid var(--border);
  }
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  tr:hover td{background:var(--surface-alt);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);}
  .table-wrap table{border:none;box-shadow:none;border-radius:0;}
  .chip{
    display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;
    color:#fff;white-space:nowrap;
  }
  .fileref{font-family:'IBM Plex Mono',monospace;font-size:13.5px;white-space:nowrap;color:var(--text-muted);}
  .fid{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .filter-count{font-size:13px;color:var(--text-muted);margin-top:8px;}

  /* ---------- rgpd ---------- */
  .rgpd-evidence{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-muted);}

  /* ---------- recommendations ---------- */
  .rec-group{margin-bottom:22px;}
  .rec-group:last-child{margin-bottom:0;}
  .rec-heading{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .rec-priority{
    font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:#fff;
    padding:3px 8px;border-radius:6px;
  }
  .rec-sev{font-size:14px;color:var(--text-muted);}
  .rec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;}
  .rec-list li{
    display:grid;grid-template-columns:44px minmax(0,220px) minmax(0,1fr);gap:12px;padding:8px 10px;
    border-bottom:1px solid var(--border);font-size:14px;align-items:baseline;
  }
  .rec-list li:last-child{border-bottom:none;}
  .rec-list .fileref{white-space:normal;word-break:break-all;}

  /* ---------- issues ---------- */
  .issue-block{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);
  }
  .issue-header{
    display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
    background:var(--surface-alt);border-bottom:1px solid var(--border);
  }
  .issue-header .issue-title{font-size:14px;font-weight:600;font-family:'IBM Plex Mono',monospace;}
  .issue-block pre{
    margin:0;padding:14px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
    max-height:340px;overflow-y:auto;color:var(--text);
  }

  /* ---------- lista de validação (checklist) ---------- */
  .checklist-section-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .checklist-section-header>div{min-width:0;}
  .checklist-table{table-layout:fixed;overflow-wrap:normal;word-break:normal;}
  .checklist-table th{text-transform:none;letter-spacing:normal;font-size:13px;}
  .checklist-table th:nth-child(1),.checklist-table td:nth-child(1){width:40px;text-align:center;}
  .checklist-table th:nth-child(2),.checklist-table td:nth-child(2){width:100px;}
  .checklist-table th:nth-child(3),.checklist-table td:nth-child(3){width:29%;}
  .checklist-table th:nth-child(4),.checklist-table td:nth-child(4){width:31%;}
  .checklist-table th:nth-child(5),.checklist-table td:nth-child(5){width:10%;}
  .checklist-table th:nth-child(6),.checklist-table td:nth-child(6){width:17%;}
  .checklist-check-header{color:var(--accent);}
  .checklist-check-header svg{display:inline-block;vertical-align:middle;}
  .checklist-table td.fileref{white-space:normal;word-break:break-word;}
  .checklist-table td.checklist-notes{padding:16px 10px;}
  .checklist-check input[type="checkbox"]{width:16px;height:16px;margin:0;}
  .checklist-table th,.checklist-table td{border-right:1px solid var(--border);}
  .checklist-table th:last-child,.checklist-table td:last-child{border-right:none;}

  .no-print{}
  @media print{
    @page{size:A4;margin:1.2cm;}
    .no-print{display:none;}
    body{counter-reset:page;background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .app{display:block;}
    .report-root{max-width:none;padding:0;margin:0;}
    .issue-block pre{max-height:none;overflow:visible;}
    .table-wrap{overflow:visible;}
    .report-page{border-bottom:none;break-after:page;padding:12px 0;}
    .report-page:last-child{break-after:auto;}
    .report-page::after{
      content:"Relat\00F3rio de Auditoria de Seguran\00E7a \2014 " attr(data-project) " \00B7 p\00E1gina " counter(page);
      counter-increment:page;
      display:block;margin-top:24px;font-size:11px;color:#666;
    }
    /* When printing only the checklist (via the "Imprimir lista de validação"
       button), body.printing-checklist-only is toggled just for the print job
       so every other report-page is hidden and only #checklist-section prints. */
    body.printing-checklist-only .report-page:not(#checklist-section){display:none;}
    body.printing-checklist-only #checklist-section{break-after:auto;}
  }

  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;}
    .exec-grid,.sw-grid,.cover-grid{grid-template-columns:1fr;}
    .rec-list li{grid-template-columns:1fr;}
    .toolbar{flex-wrap:wrap;row-gap:8px;padding:14px 16px;}
    .report-root{padding:0 16px 48px;}
    .checklist-table{table-layout:auto;}
    .checklist-table th:nth-child(3),.checklist-table td:nth-child(3),
    .checklist-table th:nth-child(4),.checklist-table td:nth-child(4),
    .checklist-table th:nth-child(5),.checklist-table td:nth-child(5),
    .checklist-table th:nth-child(6),.checklist-table td:nth-child(6){width:auto;min-width:180px;}
  }
</style>

<div class="app">
  <aside class="sidebar no-print">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <div class="brand-title">AI-ditoria</div>
        <div class="brand-sub">Auditorias de seguran&ccedil;a &amp; RGPD</div>
      </div>
    </div>
    <div>
      <div class="sidebar-label">Projetos</div>
      <div id="project-list" class="project-list">
        <div class="sidebar-empty">A carregar&hellip;</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="toolbar no-print">
      <div class="toolbar-info" id="toolbar-info">A carregar dados&hellip;</div>
      <button class="btn btn-accent" id="print-btn" type="button">Exportar PDF</button>
    </header>
    <div class="report-root" id="report-root">
      <div class="empty-state"><h2>A carregar&hellip;</h2></div>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
   * PORTED CONSTANTS (verbatim from docs/security-audit/studio/lib/constants.mjs)
   * ===================================================================== */
  const CATEGORY_NAMES = {
    1: 'Banco sem tranca (isolamento e injeção)',
    2: 'Permissão definida no navegador',
    3: 'IDOR',
    4: 'Chaves expostas',
    5: 'Inputs sem tratamento (XSS)',
    6: 'Autenticação, sessões e criptografia',
    7: 'SSRF',
    8: 'Integridade de escrita (CSRF/path/upload/concorrência)',
    9: 'Rate limiting, força bruta e exhaustion',
    10: 'Dependências, IaC e supply-chain',
    11: 'Fuga de informação',
    12: 'Compliance RGPD',
  };

  const SEVERITY_ORDER = ['critica', 'alta', 'media', 'baixa', 'informativa'];

  const SEVERITY_COLORS = {
    critica: '#B91C1C',
    alta: '#EA580C',
    media: '#D97706',
    baixa: '#2563EB',
    informativa: '#6B7280',
  };

  const STRENGTH_COLOR = '#059669';

  /* =====================================================================
   * PORTED FUNCTIONS (verbatim bodies from lib/report-derive.mjs and
   * lib/issue-markdown.mjs — export/import keywords dropped since this
   * is a single non-module inline script)
   * ===================================================================== */

  function countBySeverity(findings) {
    const counts = Object.fromEntries(SEVERITY_ORDER.map(s => [s, 0]));
    for (const f of findings) counts[f.severity] += 1;
    return SEVERITY_ORDER.map(severity => ({
      severity, count: counts[severity], color: SEVERITY_COLORS[severity],
    }));
  }

  function countByCategory(findings) {
    const counts = Object.fromEntries(Object.keys(CATEGORY_NAMES).map(id => [Number(id), 0]));
    for (const f of findings) counts[f.category] += 1;
    return Object.keys(CATEGORY_NAMES).map(Number).map(id => ({
      id, name: CATEGORY_NAMES[id], count: counts[id],
    }));
  }

  function groupRecommendations(findings) {
    const groups = [];
    let priorityIndex = 1;
    for (const severity of SEVERITY_ORDER) {
      const matches = findings
        .filter(f => f.severity === severity)
        .sort((a, b) => a.file.localeCompare(b.file) || a.line - b.line);
      if (matches.length === 0) continue;
      groups.push({ priority: `P${priorityIndex}`, severity, findings: matches });
      priorityIndex += 1;
    }
    return groups;
  }

  function buildIssueMarkdown(groupIds, findingsById, index) {
    const group = groupIds.map(id => findingsById.get(id));
    const severities = group.map(f => f.severity);
    const worstSeverity = SEVERITY_ORDER.find(s => severities.includes(s));
    const labels = ['security', worstSeverity];
    if (group.some(f => f.rgpd_article)) labels.push('rgpd');

    const title = group.length === 1
      ? group[0].desc.slice(0, 80)
      : `${group.length} achados relacionados: ${group.map(f => f.id).join(', ')}`;

    const sections = group.map(f => [
      `#### ${f.id} — ${f.file}:${f.line}`,
      '',
      `**Descrição:** ${f.desc}`,
      '',
      '**Evidência:**',
      '```',
      f.code,
      '```',
      '',
      `**Por que é explorável:** ${f.why}`,
      '',
      `**Impacto:** ${f.impact}`,
      '',
      `**Sugestão de correção:** ${f.fix}`,
      '',
      '**Critérios de aceite:**',
      ...f.acceptance.map(a => `- [ ] ${a}`),
    ].join('\n'));

    return [
      `--- ISSUE ${index} ---`,
      `## [Segurança] ${title}`,
      '',
      `**Labels:** ${labels.join(', ')}`,
      '',
      ...sections,
      '',
      `--- FIM ISSUE ${index} ---`,
    ].join('\n');
  }

  function buildAllIssues(issueGroups, findings) {
    const findingsById = new Map(findings.map(f => [f.id, f]));
    return issueGroups.map((group, i) => buildIssueMarkdown(group, findingsById, i + 1));
  }

  function slugify(project) {
    return project.toLowerCase().replace(/[\s_]+/g, '-').replace(/[^a-z0-9-]/g, '');
  }

  /* =====================================================================
   * PRESENTATION HELPERS (not ported — display-only additions)
   * ===================================================================== */

  const SEVERITY_LABELS = {
    critica: 'Crítica', alta: 'Alta', media: 'Média', baixa: 'Baixa', informativa: 'Informativa',
  };

  const RGPD_STATUS_META = {
    conforme: { label: 'Conforme', color: STRENGTH_COLOR },
    nao_conforme: { label: 'Não conforme', color: SEVERITY_COLORS.critica },
    nao_verificada: { label: 'Não verificada', color: SEVERITY_COLORS.media },
    nao_aplicavel: { label: 'Não aplicável', color: SEVERITY_COLORS.informativa },
  };

  function fmtPct(n, total) {
    if (!total) return '0%';
    return `${Math.round((n / total) * 100)}%`;
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    }
    for (const child of children || []) {
      if (child == null) continue;
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  /* =====================================================================
   * STATE + STATIC DATA LOADING
   *
   * The dashboard's data now lives as plain JSON files under ./data/,
   * fetched over relative paths — no Claude-specific runtime API of any
   * kind. data/index.json is the manifest ({ projects: [{slug, runs[]}] });
   * data/<slug>/<date>.json is one findings document.
   * ===================================================================== */

  const HIDDEN_PROJECTS_KEY = 'audit-studio-hidden-projects';

  /** Projects removed via the dashboard's delete button. Deleting only hides a project in
   * this browser (localStorage) — the studio is a static site with no write access to the
   * underlying data/ files, so nothing is actually erased on disk. */
  function loadHiddenSlugs() {
    try {
      return new Set(JSON.parse(localStorage.getItem(HIDDEN_PROJECTS_KEY) || '[]'));
    } catch {
      return new Set();
    }
  }

  function saveHiddenSlugs(set) {
    try {
      localStorage.setItem(HIDDEN_PROJECTS_KEY, JSON.stringify([...set]));
    } catch {}
  }

  const CHECKLIST_STATE_KEY = 'audit-studio-checklist';

  /** Confirm-checkbox state for the printable validation checklist, keyed by
   * `${slug}/${auditDate}/${findingId}` → boolean. Per-browser only, same
   * ceiling as loadHiddenSlugs/saveHiddenSlugs — there is no backend to
   * sync this across machines or people. */
  function loadChecklistState() {
    try {
      return JSON.parse(localStorage.getItem(CHECKLIST_STATE_KEY) || '{}');
    } catch {
      return {};
    }
  }

  function saveChecklistState(state) {
    try {
      localStorage.setItem(CHECKLIST_STATE_KEY, JSON.stringify(state));
    } catch {}
  }

  function checklistKey(slug, auditDate, findingId) {
    return `${slug}/${auditDate}/${findingId}`;
  }

  /* =====================================================================
   * PORTED FUNCTION (verbatim from docs/security-audit/studio/lib/report-derive.mjs)
   * ===================================================================== */
  function findingKey(f) {
    return `${f.file}:${f.line}`;
  }
  function diffFindings(runA, runB) {
    const findingsA = runA.findings || [];
    const findingsB = runB.findings || [];
    const keysA = new Set(findingsA.map(findingKey));
    const keysB = new Set(findingsB.map(findingKey));
    return {
      fixed: findingsA.filter(f => !keysB.has(findingKey(f))),
      new: findingsB.filter(f => !keysA.has(findingKey(f))),
      unchanged: findingsB.filter(f => keysA.has(findingKey(f))),
    };
  }

  const state = {
    manifest: null, slugs: [], runsBySlug: {}, runErrors: {},
    openSlug: null, activeSlug: null, activeRunId: null,
    hiddenSlugs: loadHiddenSlugs(),
    checklistState: loadChecklistState(),
    compareSlug: null, compareDates: null,
  };

  async function loadManifest() {
    const res = await fetch('./data/index.json');
    if (!res.ok) throw new Error(`manifest fetch failed: ${res.status}`);
    return res.json();
  }

  async function loadRuns(slug) {
    const entry = (state.manifest.projects || []).find(p => p.slug === slug);
    const dates = entry ? (entry.runs || []).slice() : [];
    const docs = await Promise.all(dates.map(async date => {
      const res = await fetch(`./data/${slug}/${date}.json`);
      if (!res.ok) throw new Error(`run fetch failed for ${slug}/${date}: ${res.status}`);
      const data = await res.json();
      return { _id: date, ...data };
    }));
    return docs.sort((a, b) => (b.audit_date || b._id).localeCompare(a.audit_date || a._id));
  }

  /* =====================================================================
   * SIDEBAR
   * ===================================================================== */

  function renderSidebar() {
    const list = document.getElementById('project-list');
    list.innerHTML = '';
    if (state.slugs.length === 0) {
      list.appendChild(el('div', { class: 'sidebar-empty', text: 'Sem projetos auditados ainda.' }));
      return;
    }
    for (const slug of state.slugs) {
      const deleteBtn = el('button', {
        class: 'project-delete-btn', type: 'button',
        title: `Remover ${slug} do dashboard`, 'aria-label': `Remover ${slug} do dashboard`,
        onclick: (e) => { e.stopPropagation(); deleteProject(slug); },
      });
      deleteBtn.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
      const item = el('div', { class: 'project-item' }, [
        el('div', { class: 'project-row' }, [
          el('button', {
            class: 'project-btn', type: 'button', 'data-open': String(state.openSlug === slug),
            onclick: () => toggleProject(slug),
          }, [el('span', { class: 'caret', text: '▸' }), el('span', { text: slug })]),
          deleteBtn,
        ]),
      ]);
      if (state.openSlug === slug) {
        const runs = state.runsBySlug[slug] || [];
        let runList;
        if (state.runErrors[slug]) {
          runList = el('div', { class: 'run-list' }, [
            el('div', { class: 'sidebar-note', text: 'Erro ao carregar auditorias.' }),
          ]);
        } else {
          runList = el('div', { class: 'run-list' }, runs.length
            ? runs.map(run => el('button', {
                class: 'run-btn', type: 'button',
                'data-active': String(state.activeSlug === slug && state.activeRunId === run._id),
                onclick: () => selectRun(slug, run),
              }, [
                el('span', { class: 'run-date', text: run.audit_date || run._id }),
                el('span', { class: 'run-meta', text: `${(run.findings || []).length} achados` }),
              ]))
            : [el('div', { class: 'sidebar-note', text: 'Sem auditorias.' })]);
        }
        item.appendChild(runList);
        if (!state.runErrors[slug] && runs.length >= 2) {
          const compareBtn = el('button', {
            class: 'btn no-print', type: 'button', style: 'margin:6px 0 6px 26px;font-size:12px;padding:5px 10px;',
            onclick: () => openCompare(slug),
          }, ['Comparar auditorias']);
          item.appendChild(compareBtn);
        }
      }
      list.appendChild(item);
    }
  }

  /** Loads (or reuses the cached) run list for `slug`, tracking success/failure in
   * `state.runsBySlug`/`state.runErrors` so callers never need their own try/catch. */
  async function ensureRunsLoaded(slug) {
    if (state.runsBySlug[slug] && !state.runErrors[slug]) return state.runsBySlug[slug];
    try {
      state.runsBySlug[slug] = await loadRuns(slug);
      delete state.runErrors[slug];
    } catch (err) {
      state.runsBySlug[slug] = [];
      state.runErrors[slug] = true;
    }
    return state.runsBySlug[slug];
  }

  async function toggleProject(slug) {
    state.openSlug = state.openSlug === slug ? null : slug;
    if (state.openSlug) await ensureRunsLoaded(slug);
    renderSidebar();
  }

  /** Removes a project from the dashboard's own view. Since the studio has no backend,
   * this can only hide the project in this browser (localStorage) — it never touches
   * the data/ files, so the project reappears if cleared or opened elsewhere. */
  async function deleteProject(slug) {
    const confirmed = confirm(
      `Remover "${slug}" da lista deste dashboard?\n\nIsto só esconde o projeto neste browser — os ficheiros de auditoria não são apagados.`
    );
    if (!confirmed) return;

    state.hiddenSlugs.add(slug);
    saveHiddenSlugs(state.hiddenSlugs);
    state.slugs = state.slugs.filter(s => s !== slug);
    delete state.runsBySlug[slug];
    delete state.runErrors[slug];
    if (state.openSlug === slug) state.openSlug = null;

    if (state.activeSlug === slug) {
      state.activeSlug = null;
      state.activeRunId = null;
      if (state.slugs.length > 0) {
        await selectProjectDefault(state.slugs[0]);
        return;
      }
      renderSidebar();
      renderEmptyReport('Ainda sem projetos auditados. Corra a skill de auditoria para gerar o primeiro relatório.');
      return;
    }

    renderSidebar();
  }

  function selectRun(slug, run) {
    state.activeSlug = slug;
    state.activeRunId = run._id;
    renderSidebar();
    renderReport(run);
  }

  /** Opens the compare-runs view for `slug`, defaulting to its two most
   * recent runs (index 0 = newest, per loadRuns' descending sort). */
  function openCompare(slug) {
    const runs = state.runsBySlug[slug] || [];
    if (runs.length < 2) return;
    state.compareSlug = slug;
    state.compareDates = { a: runs[1]._id, b: runs[0]._id };
    state.activeSlug = null;
    state.activeRunId = null;
    renderSidebar();
    renderCompare();
  }

  function renderCompareRowList(title, findings) {
    if (findings.length === 0) {
      return el('div', {}, [
        el('h3', { style: 'font-size:14px;margin:16px 0 8px;', text: `${title} (0)` }),
        el('p', { style: 'color:var(--text-muted);font-size:13px;', text: 'Nenhum.' }),
      ]);
    }
    const tbody = el('tbody', {}, findings.map(f => el('tr', {}, [
      el('td', {}, [el('span', { class: 'chip', style: `background:${SEVERITY_COLORS[f.severity]}`, text: SEVERITY_LABELS[f.severity] })]),
      el('td', { class: 'fileref' }, [el('span', { class: 'fid', text: f.id }), ' · ', `${f.file}:${f.line}`]),
      el('td', { text: f.desc }),
    ])));
    const table = el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: 'Severidade' }), el('th', { text: 'Ficheiro : linha' }), el('th', { text: 'Descrição' }),
      ])]),
      tbody,
    ]);
    return el('div', {}, [
      el('h3', { style: 'font-size:14px;margin:16px 0 8px;', text: `${title} (${findings.length})` }),
      el('div', { class: 'table-wrap' }, [table]),
    ]);
  }

  function renderCompare() {
    const slug = state.compareSlug;
    const runs = state.runsBySlug[slug] || [];
    document.getElementById('toolbar-info').innerHTML = '';
    document.getElementById('toolbar-info').appendChild(
      el('span', {}, [el('strong', { text: slug }), ` — comparar auditorias`])
    );

    const dateOptions = runs.map(r => el('option', { value: r._id, text: r.audit_date || r._id }));
    const selectA = el('select', { 'aria-label': 'Auditoria A (mais antiga)' }, dateOptions.map(o => o.cloneNode(true)));
    selectA.value = state.compareDates.a;
    selectA.addEventListener('change', () => { state.compareDates.a = selectA.value; renderCompare(); });
    const selectB = el('select', { 'aria-label': 'Auditoria B (mais recente)' }, dateOptions.map(o => o.cloneNode(true)));
    selectB.value = state.compareDates.b;
    selectB.addEventListener('change', () => { state.compareDates.b = selectB.value; renderCompare(); });

    const runA = runs.find(r => r._id === state.compareDates.a);
    const runB = runs.find(r => r._id === state.compareDates.b);
    const root = document.getElementById('report-root');
    root.innerHTML = '';
    if (!runA || !runB) {
      root.appendChild(el('p', { text: 'Escolhe duas auditorias para comparar.' }));
      return;
    }
    const diff = diffFindings(runA, runB);
    root.appendChild(el('section', { class: 'report-page' }, [
      el('div', { class: 'section-eyebrow', text: 'Comparação' }),
      el('h2', { class: 'section-title', text: `${slug}: comparar auditorias` }),
      el('div', { class: 'no-print', style: 'display:flex;gap:16px;align-items:center;margin-bottom:18px;' }, [
        el('label', {}, ['A (mais antiga): ', selectA]),
        el('label', {}, ['B (mais recente): ', selectB]),
      ]),
      renderCompareRowList('Corrigidos', diff.fixed),
      renderCompareRowList('Novos', diff.new),
      renderCompareRowList('Ainda presentes', diff.unchanged),
    ]));
  }

  async function selectProjectDefault(slug) {
    state.openSlug = slug;
    const runs = await ensureRunsLoaded(slug);
    renderSidebar();
    if (state.runErrors[slug]) {
      renderEmptyReport('Não foi possível carregar as auditorias deste projeto. Tente novamente mais tarde.');
    } else if (runs.length > 0) {
      selectRun(slug, runs[0]);
    } else {
      renderEmptyReport(`"${slug}" ainda não tem auditorias registadas.`);
    }
  }

  function donutSvg(sevCounts, total) {
    const r = 74, cx = 100, cy = 100, sw = 26;
    const circ = 2 * Math.PI * r;
    let offset = 0;
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 200 200');
    svg.setAttribute('width', '200');
    svg.setAttribute('height', '200');
    const group = document.createElementNS(svgNS, 'g');
    group.setAttribute('transform', `rotate(-90 ${cx} ${cy})`);
    if (total === 0) {
      const circle = document.createElementNS(svgNS, 'circle');
      circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
      circle.setAttribute('fill', 'none');
      circle.setAttribute('stroke', 'var(--border)');
      circle.setAttribute('stroke-width', sw);
      group.appendChild(circle);
    } else {
      for (const seg of sevCounts) {
        if (seg.count === 0) continue;
        const frac = seg.count / total;
        const dash = frac * circ;
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
        circle.setAttribute('fill', 'none');
        circle.setAttribute('stroke', seg.color);
        circle.setAttribute('stroke-width', sw);
        circle.setAttribute('stroke-dasharray', `${dash} ${circ - dash}`);
        circle.setAttribute('stroke-dashoffset', String(-offset));
        group.appendChild(circle);
        offset += dash;
      }
    }
    svg.appendChild(group);
    return svg;
  }

  function buildExecSummary(doc) {
    const sevCounts = countBySeverity(doc.findings);
    const total = doc.findings.length;
    const catCounts = countByCategory(doc.findings);
    const maxCat = Math.max(1, ...catCounts.map(c => c.count));

    const donutFigure = el('div', { class: 'donut-figure' }, [donutSvg(sevCounts, total)]);
    donutFigure.appendChild(el('div', { class: 'donut-center' }, [
      el('div', { class: 'count', text: String(total) }),
      el('div', { class: 'label', text: 'achados' }),
    ]));

    const legend = el('div', { class: 'legend' }, sevCounts.map(seg => el('div', { class: 'legend-row' }, [
      el('span', { class: 'legend-dot', style: `background:${seg.color}` }),
      el('span', { class: 'legend-name', text: SEVERITY_LABELS[seg.severity] }),
      el('span', { class: 'legend-count', text: `${seg.count} (${fmtPct(seg.count, total)})` }),
    ])));

    const barChart = el('div', { class: 'bar-chart' }, catCounts.map(c => el('div', { class: 'bar-col' }, [
      el('div', { class: 'bar-count', text: String(c.count) }),
      el('div', { class: 'bar-track' }, [
        el('div', { class: 'bar', style: `height:${Math.max(3, (c.count / maxCat) * 100)}%`, title: c.name }),
      ]),
      el('div', { class: 'bar-id', text: String(c.id) }),
    ])));

    const catLegend = el('div', { class: 'category-legend' }, catCounts.map(c =>
      el('div', {}, [el('span', {}, [el('b', { text: String(c.id) }), c.name]), el('span', { text: String(c.count) })])));

    return el('section', { class: 'report-page', 'data-project': doc.project }, [
      el('div', { class: 'section-eyebrow', text: 'Resumo Executivo' }),
      el('h2', { class: 'section-title', text: 'Achados por severidade e categoria' }),
      el('div', { class: 'exec-grid' }, [
        el('div', { class: 'donut-wrap' }, [donutFigure, legend]),
        el('div', {}, [barChart, catLegend]),
      ]),
    ]);
  }

  function buildStrengthsWeaknesses(doc) {
    const strengths = el('div', { class: 'sw-card' }, [
      el('h3', { text: `Pontos fortes (${doc.strengths.length})` }),
      ...doc.strengths.map(s => el('div', { class: 'strength-item' }, [
        el('span', { class: 'strength-dot', style: `background:${STRENGTH_COLOR}` }),
        el('div', { class: 'strength-text' }, [
          el('span', { class: 'evidence', text: s.evidence }),
          el('span', { class: 'note', text: s.note }),
        ]),
      ])),
    ]);

    const weaknesses = el('div', { class: 'sw-card' }, [
      el('h3', { text: 'Fragilidades' }),
      el('div', { class: 'sidebar-label', text: 'Segurança', style: 'margin-top:0' }),
      el('ul', { class: 'weak-list' }, doc.weaknesses.security.map(w => el('li', { text: w }))),
      el('div', { class: 'sidebar-label', text: 'RGPD', style: 'margin-top:14px' }),
      el('ul', { class: 'weak-list' }, doc.weaknesses.rgpd.map(w => el('li', { text: w }))),
    ]);

    return el('section', { class: 'report-page', 'data-project': doc.project }, [
      el('div', { class: 'section-eyebrow', text: 'Diagnóstico' }),
      el('h2', { class: 'section-title', text: 'Pontos fortes e fragilidades' }),
      el('div', { class: 'sw-grid' }, [strengths, weaknesses]),
    ]);
  }

  function applyFindingsFilter() {
    const sevVal = document.getElementById('filter-severity').value;
    const catVal = document.getElementById('filter-category').value;
    const rows = document.querySelectorAll('#findings-tbody tr');
    let visible = 0;
    rows.forEach(row => {
      const matchSev = !sevVal || row.dataset.severity === sevVal;
      const matchCat = !catVal || row.dataset.category === catVal;
      const show = matchSev && matchCat;
      row.hidden = !show;
      if (show) visible += 1;
    });
    document.getElementById('filter-count').textContent = `${visible} de ${rows.length} achados visíveis`;
  }

  function buildFindingsTable(doc) {
    const sevSelect = el('select', { id: 'filter-severity', 'aria-label': 'Filtrar por severidade', onchange: applyFindingsFilter }, [
      el('option', { value: '', text: 'Todas as severidades' }),
      ...SEVERITY_ORDER.map(s => el('option', { value: s, text: SEVERITY_LABELS[s] })),
    ]);
    const catSelect = el('select', { id: 'filter-category', 'aria-label': 'Filtrar por categoria', onchange: applyFindingsFilter }, [
      el('option', { value: '', text: 'Todas as categorias' }),
      ...Object.keys(CATEGORY_NAMES).map(Number).map(id =>
        el('option', { value: String(id), text: `${id}. ${CATEGORY_NAMES[id]}` })),
    ]);

    const tbody = el('tbody', { id: 'findings-tbody' }, doc.findings.map(f => el('tr', {
      'data-severity': f.severity, 'data-category': String(f.category),
    }, [
      el('td', {}, [el('span', { class: 'chip', style: `background:${SEVERITY_COLORS[f.severity]}`, text: SEVERITY_LABELS[f.severity] })]),
      el('td', { class: 'fileref' }, [el('span', { class: 'fid', text: f.id }), ' · ', `${f.file}:${f.line}`]),
      el('td', { text: f.desc }),
    ])));

    const table = el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: 'Severidade' }), el('th', { text: 'Ficheiro : linha' }), el('th', { text: 'Descrição' }),
      ])]),
      tbody,
    ]);

    return el('section', { class: 'report-page', 'data-project': doc.project }, [
      el('div', { class: 'section-eyebrow', text: 'Detalhe' }),
      el('h2', { class: 'section-title', text: `Achados (${doc.findings.length})` }),
      el('div', { class: 'filters no-print' }, [sevSelect, catSelect]),
      el('div', { class: 'table-wrap' }, [table]),
      el('div', { id: 'filter-count', class: 'filter-count no-print', text: `${doc.findings.length} de ${doc.findings.length} achados visíveis` }),
    ]);
  }

  function buildRgpdPanel(doc) {
    if (!doc.rgpd_panel || doc.rgpd_panel.length === 0) return null;
    const tbody = el('tbody', {}, doc.rgpd_panel.map(p => {
      const meta = RGPD_STATUS_META[p.status] || { label: p.status, color: SEVERITY_COLORS.informativa };
      return el('tr', {}, [
        el('td', { class: 'fid', text: p.id }),
        el('td', { text: p.topic }),
        el('td', {}, [el('span', { class: 'chip', style: `background:${meta.color}`, text: meta.label })]),
        el('td', { class: 'rgpd-evidence', text: p.evidence }),
      ]);
    }));
    const table = el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: 'ID' }), el('th', { text: 'Tópico' }), el('th', { text: 'Estado' }), el('th', { text: 'Evidência' }),
      ])]),
      tbody,
    ]);
    return el('section', { class: 'report-page', 'data-project': doc.project }, [
      el('div', { class: 'section-eyebrow', text: 'RGPD' }),
      el('h2', { class: 'section-title', text: `Painel de conformidade (${doc.rgpd_panel.length})` }),
      el('div', { class: 'table-wrap' }, [table]),
    ]);
  }

  function buildRecommendations(doc) {
    const groups = groupRecommendations(doc.findings);
    return el('section', { class: 'report-page', 'data-project': doc.project }, [
      el('div', { class: 'section-eyebrow', text: 'Plano de Ação' }),
      el('h2', { class: 'section-title', text: 'Recomendações priorizadas' }),
      ...groups.map(g => el('div', { class: 'rec-group' }, [
        el('div', { class: 'rec-heading' }, [
          el('span', { class: 'rec-priority', style: `background:${SEVERITY_COLORS[g.severity]}`, text: g.priority }),
          el('span', { class: 'rec-sev', text: `${SEVERITY_LABELS[g.severity]} — ${g.findings.length} achado(s)` }),
        ]),
        el('ul', { class: 'rec-list' }, g.findings.map(f => el('li', {}, [
          el('span', { class: 'fid', text: f.id }),
          el('span', { class: 'fileref', text: `${f.file}:${f.line}` }),
          el('span', { text: f.fix }),
        ]))),
      ])),
    ]);
  }

  async function copyText(text, btn) {
    const original = btn.textContent;
    const succeed = () => { btn.textContent = 'Copiado!'; setTimeout(() => { btn.textContent = original; }, 1500); };
    const fail = () => { btn.textContent = 'Falhou'; setTimeout(() => { btn.textContent = original; }, 1500); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        succeed();
        return;
      }
      throw new Error('clipboard api unavailable');
    } catch (err) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        succeed();
      } catch (err2) {
        fail();
      }
    }
  }

  function buildIssues(doc) {
    const issues = buildAllIssues(doc.issue_groups, doc.findings);
    return el('section', { class: 'report-page', 'data-project': doc.project }, [
      el('div', { class: 'section-eyebrow', text: 'GitHub' }),
      el('h2', { class: 'section-title', text: `Issues para o GitHub (${issues.length})` }),
      ...issues.map((md, i) => {
        const pre = el('pre', { text: md });
        const copyBtn = el('button', { class: 'btn btn-copy no-print', type: 'button' }, ['Copiar']);
        copyBtn.addEventListener('click', () => copyText(md, copyBtn));
        return el('div', { class: 'issue-block' }, [
          el('div', { class: 'issue-header' }, [
            el('span', { class: 'issue-title', text: `Issue ${i + 1}` }),
            copyBtn,
          ]),
          pre,
        ]);
      }),
    ]);
  }

  function buildValidationChecklist(doc) {
    const tbody = el('tbody', {}, doc.findings.map(f => {
      const key = checklistKey(state.activeSlug, doc.audit_date, f.id);
      const checkbox = el('input', { type: 'checkbox', 'aria-label': `Achado confirmado: ${f.id}` });
      checkbox.checked = Boolean(state.checklistState[key]);
      checkbox.addEventListener('change', () => {
        state.checklistState[key] = checkbox.checked;
        saveChecklistState(state.checklistState);
      });
      return el('tr', {}, [
        el('td', { class: 'checklist-check' }, [checkbox]),
        el('td', {}, [el('span', { class: 'chip', style: `background:${SEVERITY_COLORS[f.severity]}`, text: SEVERITY_LABELS[f.severity] })]),
        el('td', { class: 'fileref' }, [el('span', { class: 'fid', text: f.id }), ' · ', `${f.file}:${f.line}`, ' — ', f.desc]),
        el('td', { text: f.fix }),
        el('td', { class: 'checklist-notes' }),
        el('td', { class: 'checklist-notes' }),
      ]);
    }));

    const table = el('table', { class: 'checklist-table' }, [
      el('thead', {}, [el('tr', {}, [
        (() => {
          const th = el('th', { class: 'checklist-check-header', title: 'Confirmado', 'aria-label': 'Confirmado' });
          th.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
          return th;
        })(),
        el('th', { text: 'Severidade' }),
        el('th', { text: 'Achado' }),
        el('th', { text: 'Ação recomendada' }),
        el('th', { text: 'Notas' }),
        el('th', { text: 'Responsável / Prazo' }),
      ])]),
      tbody,
    ]);

    const printChecklistBtn = el('button', { class: 'btn no-print', type: 'button' }, ['Imprimir lista de validação']);
    printChecklistBtn.addEventListener('click', () => {
      document.body.classList.add('printing-checklist-only');
      window.print();
    });

    return el('section', { class: 'report-page checklist-section', id: 'checklist-section', 'data-project': doc.project }, [
      el('div', { class: 'checklist-section-header' }, [
        el('div', {}, [
          el('div', { class: 'section-eyebrow', text: 'Reunião de validação' }),
          el('h2', { class: 'section-title', text: `Lista de Validação (${doc.findings.length})`, style: 'margin-bottom:0' }),
        ]),
        printChecklistBtn,
      ]),
      el('p', { class: 'no-print', style: 'color:var(--text-muted);font-size:14px;margin:0 0 14px;', text: 'Para preencher à mão numa reunião de validação com o cliente: uma caixa por achado, para marcar como confirmado, e colunas em branco para notas e responsável/prazo.' }),
      el('div', { class: 'table-wrap' }, [table]),
    ]);
  }

  function renderReport(doc) {
    document.getElementById('toolbar-info').innerHTML = '';
    document.getElementById('toolbar-info').appendChild(
      el('span', {}, [el('strong', { text: doc.project }), ` — auditoria de ${doc.audit_date}`])
    );
    const root = document.getElementById('report-root');
    root.innerHTML = '';
    root.appendChild(buildCover(doc));
    root.appendChild(buildExecSummary(doc));
    root.appendChild(buildCategoryCoverage(doc));
    root.appendChild(buildStrengthsWeaknesses(doc));
    root.appendChild(buildFindingsTable(doc));
    const rgpd = buildRgpdPanel(doc);
    if (rgpd) root.appendChild(rgpd);
    root.appendChild(buildRecommendations(doc));
    root.appendChild(buildIssues(doc));
    root.appendChild(buildValidationChecklist(doc));
  }

  /* =====================================================================
   * INIT
   * ===================================================================== */

  document.getElementById('print-btn').addEventListener('click', () => window.print());

  // Removes the checklist-only print scoping once the print job (or print-preview
  // dialog) is done, so the very next full-report print isn't accidentally scoped
  // down too. Registered once, globally — the checklist's own print button only
  // ever adds the class right before calling window.print().
  window.addEventListener('afterprint', () => {
    document.body.classList.remove('printing-checklist-only');
  });

  /** Renders the "can't reach the data files" degraded state in both the sidebar and the
   * report area. Used whenever fetching data/index.json (or a specific run) fails —
   * network error, missing file, invalid JSON — so the viewer sees an explicit message,
   * not a frozen "A carregar…" placeholder. */
  function showDataUnavailable(message) {
    const list = document.getElementById('project-list');
    list.innerHTML = '';
    list.appendChild(el('div', { class: 'sidebar-empty', text: 'Dados indisponíveis nesta vista.' }));
    renderEmptyReport(message);
  }

  async function main() {
    try {
      state.manifest = await loadManifest();
    } catch (err) {
      showDataUnavailable('Não foi possível carregar os projetos auditados. Tente recarregar a página.');
      return;
    }
    state.slugs = (state.manifest.projects || []).map(p => p.slug)
      .filter(slug => !state.hiddenSlugs.has(slug))
      .sort((a, b) => a.localeCompare(b));
    renderSidebar();
    if (state.slugs.length > 0) {
      await selectProjectDefault(state.slugs[0]);
    } else {
      renderEmptyReport('Ainda sem projetos auditados. Corra a skill de auditoria para gerar o primeiro relatório.');
    }
  }

  // Safety net: any failure not already caught above (a bug, or a rejection from a path
  // we didn't anticipate) still lands on the degraded state instead of an unhandled
  // rejection that leaves the page stuck on its initial "A carregar…" placeholders.
  main().catch(() => showDataUnavailable('Ocorreu um erro inesperado ao carregar o AI-ditoria.'));
})();
</script>
